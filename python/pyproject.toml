[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mntviz"
version = "0.2.0"
description = "Fingerprint minutiae plotting for Python (SVG/HTML/Jupyter)."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "mntviz contributors" }
]
dependencies = [
  "Pillow>=10.0.0",
  "numpy>=1.24.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]
# Widget interativo do picker (plot_*(picker=...)): pip install 'mntviz[widget]'
widget = [
  "anywidget>=0.9",
  "traitlets>=5"
]
# Colormaps no servidor (plot_overlay, plot_huv, colormap= do plot_mnt_match)
colors = [
  "matplotlib>=3.7"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mntviz = ["_bundle/*.js", "_bundle/*.css"]
